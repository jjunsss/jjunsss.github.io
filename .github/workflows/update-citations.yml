name: Update citations

on:
  schedule:
    - cron: "17 21 * * 0"   # every Monday 06:17 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read Google Scholar and update index.html
        run: python3 scripts/update_citations.py

      - name: Commit and publish (main + gh-pages)
        id: publish
        run: |
          if git diff --quiet; then
            echo "No citation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "jjunsss"
          git config user.email "71339943+jjunsss@users.noreply.github.com"
          git commit -am "Update Google Scholar citations"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
